apiVersion: apps/v1
kind: Deployment
metadata:
  name: mecanica-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mecanica-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mecanica-db
    spec:
      volumes:
        - name: mecanica-db
          persistentVolumeClaim:
            claimName: mecanica-db-pvc
      containers:
        - name: mecanica-db
          image: postgres:17
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: mecanica-db-secret
          volumeMounts:
            - name: mecanica-db
              mountPath: /var/lib/postgresql/data